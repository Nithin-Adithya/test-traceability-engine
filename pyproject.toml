[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-traceability-engine"
version = "0.1.0"
description = "Maps requirements to their covering test cases with semantic embeddings and reports coverage gaps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.9",
    "numpy>=1.26",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "streamlit>=1.40",
    "httpx>=0.27",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
traceability = "traceability.cli:main"

[tool.setuptools]
packages = ["traceability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
